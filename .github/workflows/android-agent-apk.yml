name: Build Personal AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-private-agent
    paths:
      - "apps/android/**"
      - ".github/workflows/android-agent-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-AI-OS-Android-APK
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
