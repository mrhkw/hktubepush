name: Personal AI OS CI

on:
  push:
    branches:
      - personal-ai
    paths:
      - "personal-ai/**"
      - ".github/workflows/personal-ai-ci.yml"
  pull_request:
    branches:
      - personal-ai
    paths:
      - "personal-ai/**"
      - ".github/workflows/personal-ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personal-ai/apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
        env:
          WEB_ORIGIN: http://localhost:3000

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: personal-ai/apps/web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
